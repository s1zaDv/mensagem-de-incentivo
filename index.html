<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Semana</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="icone">📅</div>

        <h1>Olá! Tudo bem?</h1>
        <p class="subtitulo">Um novo dia, uma nova oportunidade.</p>

        <div class="mensagem">
          <h2>☀️ Como está sua semana?</h2>
          <p>Descubra a mensagem preparada para o seu dia.</p>
        </div>

        <p class="rodape">Projeto JavaScript • Prática de programação</p>
      </section>
    </main>

    <script src="script.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e3a5f);
        color: #f1f5f9;
      }

      .container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 35px 28px;
        text-align: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .icone {
        font-size: 42px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 12px;
      }

      .subtitulo {
        color: #b8c7dc;
        line-height: 1.6;
        margin-bottom: 28px;
      }

      .mensagem {
        background: rgba(255, 255, 255, 0.06);
        padding: 22px 18px;
        border-radius: 16px;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .mensagem h2 {
        font-size: 17px;
        margin-bottom: 12px;
      }

      .mensagem p {
        color: #b8c7dc;
        font-size: 14px;
        line-height: 1.6;
      }

      .rodape {
        margin-top: 28px;
        font-size: 12px;
        color: #8294ad;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 20px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </body>
</html>
